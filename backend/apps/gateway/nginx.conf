# Waypoint Lodestar edge gateway: TLS, rate limits, routing. No auth decisions:
# every service verifies the bearer token itself (docs/architecture/PLATFORM.md §2).
# Runs as uid 101 (nginx-unprivileged); pid and temp files live under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;

  # ---- logging (JSON; no Authorization, no query string) -------------------
  log_format lodestar_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time","http2":"$http2",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout lodestar_json;

  # ---- Docker embedded DNS; variables in proxy_pass resolve at request time,
  # so the gateway starts even when an upstream container is down.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ---- upstream defaults ------------------------------------------------------
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 150s;   # above the planning agent's 120 s draft timeout
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;

  # ---- rate limiting ----------------------------------------------------------
  limit_req_zone  $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  # ---- WebSocket / HMR upgrade --------------------------------------------------
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  # ---- Cross-Origin-Opener-Policy ---------------------------------------------------
  # The field app signs in through a popup (Keycloak login, then /field/auth/callback) that hands the code
  # back through window.opener. The login pages are "unsafe-none" (security-headers-identity.conf), so the
  # field app's pages must be too, or the browser severs the opener link. Everything else stays isolated.
  map $uri $coop_policy {
    default     "same-origin";
    ~^/field/   "unsafe-none";
  }

  # ---- CORS (exact-match allow list; never a wildcard) ----------------------------
  map $http_origin $cors_origin {
    default "";
    include /etc/nginx/conf.d/cors-origins.map;
  }
  map $cors_origin $cors_methods {
    ""      "";
    default "GET, POST, PATCH, OPTIONS";
  }
  map $cors_origin $cors_headers {
    ""      "";
    default "Authorization, Content-Type, If-Match, Prefer, OData-Version, OData-MaxVersion, X-Device-Id, Idempotency-Key";
  }
  map $cors_origin $cors_expose {
    ""      "";
    default "ETag, OData-Version, Location, Idempotent-Replay";
  }
  map $cors_origin $cors_max_age {
    ""      "";
    default "600";
  }

  # ---- OData routing: entity set -> owning service ------------------------------
  # $odata_set is the named capture of the /odata/v4/<Set> location below.
  map $odata_set $odata_upstream {
    default           "";
    Users             auth:3001;
    Devices           auth:3001;
    Me                auth:3001;
    Orders            orders:3002;
    OrderLineItems    orders:3002;
    Plans             planning:3003;
    Deferrals         planning:3003;
    AgentRuns         planning:3003;
    Vehicles          fleet:3004;
    Depots            outlets:3005;
    Outlets           outlets:3005;
    Calendar          outlets:3005;
    DistrictTravel    outlets:3005;
    ServiceAllowances outlets:3005;
    DataImports       outlets:3005;
    Trips             trips:3006;
    TripStops         trips:3006;
    PODs              trips:3006;
    LoadRecords       trips:3006;
    OfflineEvents     sync:3007;
    Notifications     notifications:3008;
    AuditEntries      audit:3009;
  }

  # ---- :8080 plain HTTP: redirect only (plus the container healthcheck) --------
  server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host:8443$request_uri;
    }
  }

  # ---- :8443 TLS edge ---------------------------------------------------------------
  server {
    listen 8443 ssl default_server;
    # plain http:// sent to this TLS port (a typed URL without the s): send the browser to https:// instead of a 400
    error_page 497 =301 https://$host:$server_port$request_uri;
    http2 on;
    server_name _;

    # Written by /docker-entrypoint.d/10-dev-cert.sh: symlinks to a mounted
    # certificate (/etc/nginx/certs/tls.{crt,key}) or a DEV ONLY self-signed one.
    ssl_certificate     /tmp/gateway-certs/tls.crt;
    ssl_certificate_key /tmp/gateway-certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    limit_conn perip 50;

    # Headers for every location that does not declare its own add_header.
    include /etc/nginx/conf.d/security-headers.conf;

    # Upstream request headers. Declared here only (never in a location) so that
    # every proxied location inherits the full set. Client-supplied X-Forwarded-*
    # and X-Request-Id are overwritten, not trusted.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---- gateway liveness -------------------------------------------------------
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ---- deployed build (the commit the images were built from; the CI smoke test waits on it) ----
    location = /version {
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      alias /usr/share/nginx/version.txt;
    }

    # Service health/readiness stay on the app network; never routed.
    location ~ ^/(health|ready)$ {
      return 404;
    }

    # ---- OData: merged service document and metadata (static) -------------------
    # The merged service document is served by the auth service (as on AKS,
    # where there is no NGINX); it lists every entity set of the platform.
    # odata/service-document.json in the image is the same list, for reference.
    location ~ ^/odata/v4/?$ {
      limit_req zone=api burst=40 nodelay;
      types { }
      default_type application/json;
      include /etc/nginx/conf.d/security-headers.conf;
      include /etc/nginx/conf.d/cors.conf;
      include /etc/nginx/conf.d/no-store.conf;
      error_page 429 @odata_429;
      error_page 502 503 504 @odata_unavailable;
      if ($request_method = OPTIONS) {
        return 204;
      }
      set $service_document_upstream auth:3001;
      proxy_pass http://$service_document_upstream;
    }

    # The merged $metadata is static (generated by `npm run gen:gateway`). The gateway still
    # makes no access decision itself: auth verifies the caller's token (same check as the
    # service document) before the file is served, so $metadata needs a token like any call.
    location = /_verify_token {
      internal;
      set $verify_upstream auth:3001;
      proxy_pass http://$verify_upstream/odata/v4/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/odata/v4/\$metadata$ {
      if ($request_method = OPTIONS) {
        return 204;
      }
      auth_request /_verify_token;
      root /usr/share/nginx/odata;
      types { }
      default_type application/xml;
      try_files /metadata.xml =404;
      include /etc/nginx/conf.d/security-headers.conf;
      include /etc/nginx/conf.d/cors.conf;
      add_header OData-Version "4.0" always;
    }

    # ---- OData: route by entity set (set name only; keys like ('ORD1'), %27,
    # /$count, /Lodestar.Action and query strings pass through untouched) ------
    location ~ "^/odata/v4/(?<odata_set>[A-Za-z]+)(?:[(/]|$)" {
      limit_req zone=api burst=40 nodelay;

      types { }
      default_type application/json;
      include /etc/nginx/conf.d/security-headers.conf;
      include /etc/nginx/conf.d/cors.conf;
      include /etc/nginx/conf.d/no-store.conf;

      error_page 429 @odata_429;
      error_page 502 503 504 @odata_unavailable;

      if ($request_method = OPTIONS) {
        return 204;
      }
      if ($odata_upstream = "") {
        return 404 '{"error":{"code":"NotFound","message":"Unknown entity set","target":null,"details":[]}}';
      }

      # Variable without a URI part: the original request URI is passed as sent.
      proxy_pass http://$odata_upstream;
    }

    # Anything else under /odata/ ($batch, bad paths, other versions).
    location /odata/ {
      types { }
      default_type application/json;
      include /etc/nginx/conf.d/security-headers.conf;
      include /etc/nginx/conf.d/cors.conf;
      include /etc/nginx/conf.d/no-store.conf;
      return 404 '{"error":{"code":"NotFound","message":"Unknown entity set","target":null,"details":[]}}';
    }

    location @odata_429 {
      types { }
      default_type application/json;
      include /etc/nginx/conf.d/security-headers.conf;
      include /etc/nginx/conf.d/cors.conf;
      include /etc/nginx/conf.d/no-store.conf;
      add_header Retry-After "1" always;
      return 429 '{"error":{"code":"TooManyRequests","message":"Rate limit exceeded","target":null,"details":[]}}';
    }

    location @odata_unavailable {
      types { }
      default_type application/json;
      include /etc/nginx/conf.d/security-headers.conf;
      include /etc/nginx/conf.d/cors.conf;
      include /etc/nginx/conf.d/no-store.conf;
      return 503 '{"error":{"code":"ServiceUnavailable","message":"The owning service is not reachable","target":null,"details":[]}}';
    }

    # ---- OCR: photo of a display, seal or label → text (the service checks the token itself) ----
    location /ocr/ {
      set $ocr_upstream ocr:8000;
      rewrite ^/ocr/(.*)$ /$1 break;
      proxy_pass http://$ocr_upstream;
      client_max_body_size 3m;
      proxy_read_timeout 20s;
    }

    # ---- proof-of-delivery photos (sync service; the service checks the token and who may see the stop) ----
    #   POST /media/pod-photos?stopId=…  (raw JPEG/PNG/WebP, at most 3 MB)   GET /media/pod-photos/<id>   GET /media/pod-photos?stopId=…
    location ~ ^/media/pod-photos(?:/[A-Za-z0-9_-]+)?$ {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/conf.d/security-headers.conf;
      include /etc/nginx/conf.d/cors.conf;
      if ($request_method = OPTIONS) {
        return 204;
      }
      set $sync_upstream sync:3007;
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass http://$sync_upstream;
      client_max_body_size 4m;
      proxy_read_timeout 30s;
    }

    # ---- realtime: Socket.IO (server path /ws/) on notifications ------------------------
    location /ws/ {
      set $notifications_upstream notifications:3008;
      proxy_pass http://$notifications_upstream;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # ---- identity: Keycloak with KC_HTTP_RELATIVE_PATH=/auth -------------------------
    location = /auth {
      return 301 /auth/;
    }

    # Admin console and the master realm are never exposed at the edge
    # (dev admin console: http://localhost:8180 directly).
    location ^~ /auth/admin/ {
      return 403;
    }
    location ~ ^/auth/realms/master(?:/|$) {
      return 403;
    }

    # Token and login endpoints: tight per-IP rate limit.
    location ~ ^/auth/realms/[^/]+/protocol/openid-connect/(?:token|auth)$ {
      limit_req zone=auth burst=10;
      include /etc/nginx/conf.d/identity-proxy.conf;
    }
    location ~ ^/auth/realms/[^/]+/login-actions/ {
      limit_req zone=auth burst=10;
      include /etc/nginx/conf.d/identity-proxy.conf;
    }

    location /auth/ {
      include /etc/nginx/conf.d/identity-proxy.conf;
    }

    # ---- field app: Expo web export (Store, Plan phone, Dock, Run) on the same origin --------
    # Built with experiments.baseUrl=/field, so the path is passed through unchanged. Same origin as
    # /odata/, /ws/ and /auth/: no CORS, and the sign-in popup returns to /field/auth/callback.
    location = /field {
      return 301 /field/;
    }
    location /field/ {
      set $field_upstream mobile-web:8080;
      proxy_pass http://$field_upstream;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Referrer-Policy;
    }

    # ---- web: Next.js desk faces (upgrade headers above cover HMR) --------------------
    location / {
      set $frontend_upstream frontend:3000;
      proxy_pass http://$frontend_upstream;
    }
  }
}
