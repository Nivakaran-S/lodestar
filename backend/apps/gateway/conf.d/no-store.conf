# OData answers carry per-user, fast-changing data: no browser or shared cache may keep them
# (a cached Trips('…')?$expand=loadRecord once hid a shortfall flag). The services send the same;
# hiding theirs avoids a duplicate header. Include in OData locations only (pod photos are cacheable).
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
