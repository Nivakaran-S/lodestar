# =============================================================================
# Waypoint Lodestar: the whole platform on one machine.
#
#   cp .env.example .env        # dev defaults work as they are
#   docker compose up --build
#
#   https://localhost:8443          start page: pick a role (Store, Plan, Dock, Run, Admin)
#                                   desk faces (Store desk, Plan, Admin) + OData API at /odata/v4/
#   https://localhost:8443/field/   field app in the browser (Store, Plan phone, Dock, Run), same origin
#   PUBLIC_ORIGIN (.env) changes the public origin everywhere: Keycloak hostname, issuer, redirect URIs, API
#   http://localhost:8180/auth      Keycloak admin console (dev only)
#   docker compose --profile qa up sonarqube    SonarQube on http://localhost:9000
#
# Zero trust, locally (docs/architecture/PLATFORM.md §2):
#   * every service verifies every token itself (Keycloak JWKS); the gateway only routes
#   * three networks: edge (published), app (service to service), data (Postgres only)
#   * only the gateway (and the dev-only Keycloak port) publish to the host
#   * containers are non-root, read-only, with no Linux capabilities
# =============================================================================

name: lodestar

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

# shared settings for the nine NestJS services
x-service-env: &service-env
  NODE_ENV: production
  DATABASE_URL: postgresql://lodestar:${POSTGRES_PASSWORD:-lodestar-dev-only}@postgres:5432/lodestar
  OIDC_ISSUER: ${PUBLIC_ORIGIN:-https://localhost:8443}/auth/realms/lodestar
  OIDC_JWKS_URL: http://identity:8080/auth/realms/lodestar/protocol/openid-connect/certs
  OIDC_TOKEN_URL: http://identity:8080/auth/realms/lodestar/protocol/openid-connect/token
  OIDC_AUDIENCE: lodestar-api
  FIELD_CLIENT_ID: lodestar-field
  AUDIT_URL: http://audit:3009
  NOTIFICATIONS_URL: http://notifications:3008
  FLEET_URL: http://fleet:3004
  # the ML models (Task 1 stop model, Task 2A demand); set ML_URL= (empty) to keep the heuristics only
  ML_URL: ${ML_URL-http://ml:8000}
  PUBLIC_BASE_URL: ${PUBLIC_ORIGIN:-https://localhost:8443}

x-service: &service
  <<: *hardened
  networks: [app, data]
  depends_on:
    migrate: { condition: service_completed_successfully }
    identity: { condition: service_healthy }

services:

  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lodestar
      POSTGRES_USER: lodestar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lodestar-dev-only}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lodestar -d lodestar"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Socket.IO adapter: lets notifications run as several replicas (same as on Kubernetes)
  redis:
    image: redis:7-alpine
    # run as the image's redis user directly: the entrypoint's chown needs capabilities we drop
    user: "999:1000"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-dev-only}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-only}   # for the healthcheck, which runs inside the container
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/data:uid=999,gid=1000"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis-dev-only}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # migrations + seed (competition CSVs from ./data if present, else a synthetic demo set)
  migrate:
    build: { context: ./backend, dockerfile: Dockerfile.migrate }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      DATABASE_URL: postgresql://lodestar:${POSTGRES_PASSWORD:-lodestar-dev-only}@postgres:5432/lodestar
      DATA_DIR: /data
      SKIP_SEED: ${SKIP_SEED:-false}
      # Demo clock: the over-capacity demo day (YYYY-MM-DD). Empty = today in Sri Lanka. See backend/prisma/DATA.md.
      DEMO_DATE: ${DEMO_DATE:-}
    volumes:
      - ./data:/data:ro
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  # ---------------------------------------------------------------- identity (Azure: Entra ID)
  identity:
    # Keycloak 26.0 + Lodestar's sign-in extension (backend/identity/extension): each role's designed sign-in
    # screen posts to the token endpoint; no Keycloak login page on the normal paths
    build: { context: ./backend/identity }
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev-only}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # one issuer for browsers and services: <PUBLIC_ORIGIN>/auth/realms/lodestar
      KC_HOSTNAME: ${PUBLIC_ORIGIN:-https://localhost:8443}/auth
      # the realm import fills redirect URIs and web origins from it
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      KC_HOSTNAME_ADMIN: http://localhost:8180/auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only}
      LODESTAR_DEMO_PASSWORD: ${LODESTAR_DEMO_PASSWORD:-lodestar-dev-only}
      LODESTAR_ADMIN_PASSWORD: ${LODESTAR_ADMIN_PASSWORD:-lodestar-admin-dev-only}
      SVC_AUTH_SECRET: ${SVC_AUTH_SECRET:-svc-auth-dev-only}
      SVC_ORDERS_SECRET: ${SVC_ORDERS_SECRET:-svc-orders-dev-only}
      SVC_PLANNING_SECRET: ${SVC_PLANNING_SECRET:-svc-planning-dev-only}
      SVC_FLEET_SECRET: ${SVC_FLEET_SECRET:-svc-fleet-dev-only}
      SVC_OUTLETS_SECRET: ${SVC_OUTLETS_SECRET:-svc-outlets-dev-only}
      SVC_TRIPS_SECRET: ${SVC_TRIPS_SECRET:-svc-trips-dev-only}
      SVC_SYNC_SECRET: ${SVC_SYNC_SECRET:-svc-sync-dev-only}
      SVC_NOTIFICATIONS_SECRET: ${SVC_NOTIFICATIONS_SECRET:-svc-notifications-dev-only}
      SVC_AUDIT_SECRET: ${SVC_AUDIT_SECRET:-svc-audit-dev-only}
      SVC_AGENT_SECRET: ${SVC_AGENT_SECRET:-svc-agent-dev-only}
      # sign-in codes (phone + SMS) and the Dock PIN: SMS_PROVIDER log | twilio | notifylk
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      DEMO_SHOW_CODES: ${DEMO_SHOW_CODES:-true}     # demo: the app shows the code the SMS would carry
      OTP_MAX_SENDS_PER_HOUR: ${OTP_MAX_SENDS_PER_HOUR:-}   # empty: 5 an hour, or 50 while demo codes are shown
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NOTIFYLK_USER_ID: ${NOTIFYLK_USER_ID:-}
      NOTIFYLK_API_KEY: ${NOTIFYLK_API_KEY:-}
      NOTIFYLK_SENDER_ID: ${NOTIFYLK_SENDER_ID:-}
      LODESTAR_DEMO_PIN: ${LODESTAR_DEMO_PIN:-2468}  # seeds the loaders' Dock PIN when they have none
    volumes:
      - ./backend/identity:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"     # admin console, dev only
    networks: [edge, app, data]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # the image has no curl: plain HTTP over bash's /dev/tcp to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s    # first start imports the realm; slow laptops need several minutes

  # ---------------------------------------------------------------- domain services (OData v4)
  auth:
    <<: *service
    build: { context: ./backend, dockerfile: apps/auth/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3001
      OIDC_CLIENT_ID: svc-auth
      OIDC_CLIENT_SECRET: ${SVC_AUTH_SECRET:-svc-auth-dev-only}
      KEYCLOAK_ADMIN_URL: http://identity:8080/auth
      KEYCLOAK_REALM: lodestar

  orders:
    <<: *service
    build: { context: ./backend, dockerfile: apps/orders/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3002
      OIDC_CLIENT_ID: svc-orders
      OIDC_CLIENT_SECRET: ${SVC_ORDERS_SECRET:-svc-orders-dev-only}
      ENFORCE_ORDER_CUTOFF: ${ENFORCE_ORDER_CUTOFF:-true}
      ORDER_OFFLINE_GRACE_HOURS: ${ORDER_OFFLINE_GRACE_HOURS:-6}

  planning:
    <<: *service
    build: { context: ./backend, dockerfile: apps/planning/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3003
      OIDC_CLIENT_ID: svc-planning
      OIDC_CLIENT_SECRET: ${SVC_PLANNING_SECRET:-svc-planning-dev-only}
      AGENT_URL: http://agent:8000

  fleet:
    <<: *service
    build: { context: ./backend, dockerfile: apps/fleet/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3004
      OIDC_CLIENT_ID: svc-fleet
      OIDC_CLIENT_SECRET: ${SVC_FLEET_SECRET:-svc-fleet-dev-only}

  outlets:
    <<: *service
    build: { context: ./backend, dockerfile: apps/outlets/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3005
      OIDC_CLIENT_ID: svc-outlets
      OIDC_CLIENT_SECRET: ${SVC_OUTLETS_SECRET:-svc-outlets-dev-only}

  trips:
    <<: *service
    build: { context: ./backend, dockerfile: apps/trips/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3006
      OIDC_CLIENT_ID: svc-trips
      OIDC_CLIENT_SECRET: ${SVC_TRIPS_SECRET:-svc-trips-dev-only}

  sync:
    <<: *service
    build: { context: ./backend, dockerfile: apps/sync/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3007
      OIDC_CLIENT_ID: svc-sync
      OIDC_CLIENT_SECRET: ${SVC_SYNC_SECRET:-svc-sync-dev-only}

  notifications:
    <<: *service
    build: { context: ./backend, dockerfile: apps/notifications/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3008
      OIDC_CLIENT_ID: svc-notifications
      OIDC_CLIENT_SECRET: ${SVC_NOTIFICATIONS_SECRET:-svc-notifications-dev-only}
      WS_CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost:8443}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-only}@redis:6379
      # SMS behind a flag (apps/notifications/src/sms.ts): off = the faces offer no SMS; log = record only
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_FROM: ${SMS_FROM:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      identity: { condition: service_healthy }
      redis: { condition: service_healthy }

  audit:
    <<: *service
    build: { context: ./backend, dockerfile: apps/audit/Dockerfile }
    environment:
      <<: *service-env
      PORT: 3009
      OIDC_CLIENT_ID: svc-audit
      OIDC_CLIENT_SECRET: ${SVC_AUDIT_SECRET:-svc-audit-dev-only}

  # ---------------------------------------------------------------- planning agent (LangGraph; Gemini -> Groq -> template)
  agent:
    <<: *service
    build: { context: ./backend/apps/agent, dockerfile: Dockerfile }
    environment:
      AGENT_MODEL: ${AGENT_MODEL:-gemini}
      # gemini: Gemini -> Groq -> deterministic template (no key = the template only); see .env.example
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-gemini}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-groq}
      LLM_ENABLE_FALLBACK: ${LLM_ENABLE_FALLBACK:-true}
      LLM_ENABLE_CACHE: ${LLM_ENABLE_CACHE:-true}
      AGENT_MAX_REPAIR_ATTEMPTS: ${AGENT_MAX_REPAIR_ATTEMPTS:-2}
      # allocation: exact (the Datathon MILP; kept only when rule-clean and at least as good as greedy) or greedy
      AGENT_ALLOCATOR: ${AGENT_ALLOCATOR:-exact}
      AGENT_ALLOCATION_TIME_LIMIT_S: ${AGENT_ALLOCATION_TIME_LIMIT_S:-30}
      # azure-openai (optional) only phrases explanations and answers; unset → the mock (see .env.example)
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      DATABASE_URL: postgresql://lodestar:${POSTGRES_PASSWORD:-lodestar-dev-only}@postgres:5432/lodestar
      AGENT_DB_SCHEMA: agent
      OIDC_ISSUER: ${PUBLIC_ORIGIN:-https://localhost:8443}/auth/realms/lodestar
      OIDC_JWKS_URL: http://identity:8080/auth/realms/lodestar/protocol/openid-connect/certs
      OIDC_TOKEN_URL: http://identity:8080/auth/realms/lodestar/protocol/openid-connect/token
      OIDC_AUDIENCE: lodestar-api
      OIDC_CLIENT_ID: svc-agent
      OIDC_CLIENT_SECRET: ${SVC_AGENT_SECRET:-svc-agent-dev-only}
      # read the owning services directly inside the app network (each still checks the token)
      LODESTAR_SERVICE_URLS: Orders=http://orders:3002,Outlets=http://outlets:3005,Calendar=http://outlets:3005,DistrictTravel=http://outlets:3005,ServiceAllowances=http://outlets:3005,Vehicles=http://fleet:3004
      ML_URL: ${ML_URL-http://ml:8000}

  # ---------------------------------------------------------------- OCR (RapidOCR / PP-OCR mobile, CPU only)
  # "Read from photo · confirm": camera screens send a photo, the value is pre-filled, the person confirms.
  ocr:
    <<: *hardened
    build: { context: ./backend/apps/ocr, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      OIDC_ISSUER: ${PUBLIC_ORIGIN:-https://localhost:8443}/auth/realms/lodestar
      OIDC_JWKS_URL: http://identity:8080/auth/realms/lodestar/protocol/openid-connect/certs
      OIDC_AUDIENCE: lodestar-api
      OCR_THREADS: "2"
    networks: [app]
    depends_on:
      identity: { condition: service_healthy }

  # ---------------------------------------------------------------- ML (Adagard datathon models, CPU only)
  # Task 1 (stop service time + late risk) and Task 2A (weekly demand) behind /predict/stops and /forecast/weeks.
  # Internal only (app network, not routed by the gateway, no token: it holds no data and writes nothing). The
  # image carries no model: dtcore.py and the *.pkl files are mounted read-only from the host; without them
  # /health says "degraded", the endpoints answer 503 and agent / trips / planning keep their heuristics.
  ml:
    <<: *hardened
    init: true # the demand refits run in a worker process: an init reaps it
    build: { context: ./backend/apps/ml, dockerfile: Dockerfile }
    environment:
      ML_MODELS_DIR: /models
      ML_DTCORE: /opt/dtcore/dtcore.py
      ML_FORECAST_WAIT_S: "1.5"
    volumes:
      - ${ML_MODELS_DIR:-./datathon/Adagard_Datathon/models}:/models:ro
      - ${ML_DTCORE:-./datathon/Adagard_Datathon/dtcore.py}:/opt/dtcore/dtcore.py:ro
    networks: [app]

  # ---------------------------------------------------------------- edge
  gateway:
    build: { context: ./backend/apps/gateway }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    ports:
      - "8443:8443"
      - "8080:8080"
    networks: [edge, app]
    depends_on:
      frontend: { condition: service_started }
      identity: { condition: service_healthy }
      auth: { condition: service_started }

  frontend:
    # local stack keeps the ?design=1 prototype switch (smoke tests use it); production builds pass off
    # (deploy/azure-demo/compose.prod.yml, ship.sh, CI) and the Dockerfile defaults to off
    build: { context: ./frontend, args: { NEXT_PUBLIC_DESIGN_PREVIEW: "${NEXT_PUBLIC_DESIGN_PREVIEW:-on}" } }
    <<: *hardened
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]
    # API, sign-in and realtime URLs come from the page's own origin (frontend/lib/config.ts)
    environment:
      # the start page shows the demo accounts' password (the production override hides the admin one)
      DEMO_PASSWORD_HINT: ${LODESTAR_DEMO_PASSWORD:-lodestar-dev-only}
      DEMO_ADMIN_PASSWORD_HINT: ${LODESTAR_ADMIN_PASSWORD:-lodestar-admin-dev-only}
    networks: [edge]

  # served by the gateway at <PUBLIC_ORIGIN>/field/ (no host port: one origin for every face)
  # Lodestar Run is an Android app; the local stack keeps it in the browser build so the e2e suite can drive a run
  # (the demo image from CI is built without it: RUN_ON_WEB defaults to false)
  mobile-web:
    build: { context: ./mobile, args: { RUN_ON_WEB: "true" } }
    <<: *hardened
    tmpfs: ["/tmp", "/var/cache/nginx:uid=101,gid=101", "/var/run:uid=101,gid=101"]
    networks: [edge]

  # ---------------------------------------------------------------- QA (docker compose --profile qa up)
  sonarqube:
    image: sonarqube:10-community
    profiles: ["qa"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

networks:
  edge: {}
  app: { internal: true }     # no route out of the host: services talk only to each other and identity
  data: { internal: true }    # Postgres is reachable only from here

volumes:
  pgdata: {}
  sonar-data: {}
  sonar-extensions: {}
  sonar-logs: {}
