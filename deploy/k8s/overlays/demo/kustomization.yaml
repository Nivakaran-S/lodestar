# Demo overlay: the whole platform on the demo VM's k3s, synced by Argo CD (deploy/argocd/envs/demo).
# Setup and the compose <-> k3s switch: deploy/argocd/README.md, "Demo on k3s".
#
# This file holds only the image tags. CI (GitHub Actions, .github/workflows/deploy-demo.yml, job `release`)
# rewrites it on every green main build with
# `kustomize edit set image lodestar-<svc>=ghcr.io/nivakaran-s/lodestar-<svc>:<commit sha>` for every image
# listed below, and commits it with [skip ci]; `kustomize edit` reformats this file, so keep the rest in platform/.
# The names on the left are lodestar-<svc> because overlays/local has already renamed lodestar/<svc>.
#
# Build (the realm and the Postgres init script live outside this folder; Argo CD gets the same flag
# through kustomize.buildOptions in argocd-cm):
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s/overlays/demo
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- platform
images:
- name: lodestar-agent
  newName: ghcr.io/nivakaran-s/lodestar-agent
  newTag: 39659cc31eb3be22e322370bced3b34c6c940b7e
