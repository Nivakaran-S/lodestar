# Production override for the demo VM (deploy/azure-demo/README.md). Use only through ./up.sh, which checks .env first:
#   docker compose -f docker-compose.yml -f deploy/azure-demo/compose.prod.yml --env-file .env up -d --build
#
# - Caddy owns 80/443 and gets a Let's Encrypt certificate for PUBLIC_HOST (the Azure DNS name).
# - Nothing else is published: no 8443/8080 (gateway), no 8180 (Keycloak admin), no 9000 (SonarQube).
# - Keycloak runs in production mode behind the proxy; every secret comes from the VM's .env (no dev defaults).
# - Memory ceilings sized for a 4 GiB VM (the stack idles at about 1.5 GB): one leaking container is restarted
#   instead of taking the VM down. They are limits, not reservations, so their sum may exceed the VM.
x-node-small: &node-small
  mem_limit: 320m
  environment:
    NODE_OPTIONS: --max-old-space-size=192

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/azure-demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    mem_limit: 128m
    depends_on:
      gateway: { condition: service_healthy }

  gateway:
    ports: !reset []
    mem_limit: 128m

  identity:
    command: ["start", "--import-realm"]   # production mode (start-dev locally)
    ports: !reset []
    environment:
      KC_HOSTNAME_ADMIN: !reset null
      KC_HTTP_ENABLED: "true"           # TLS ends at Caddy; identity is only reachable on the internal network
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local                   # one node: no Infinispan cluster
      # heap at half the container limit (the default 70% leaves too little for metaspace under a 1 GiB ceiling)
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
    mem_limit: 1g

  migrate:
    environment:
      DEMO_DATE: ${DEMO_DATE:-}

  postgres:
    mem_limit: 512m
  redis:
    mem_limit: 64m
  auth: *node-small
  orders: *node-small
  planning: *node-small
  fleet: *node-small
  outlets: *node-small
  trips: *node-small
  sync: *node-small
  notifications: *node-small
  audit: *node-small
  agent:
    mem_limit: 448m  # numpy + scipy for the exact allocation (HiGHS)
    environment:
      # keys come from the VM's .env only (never committed); with none set the agent answers from its templates
      AGENT_MODEL: ${AGENT_MODEL:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-gemini}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-groq}
      LLM_ENABLE_FALLBACK: ${LLM_ENABLE_FALLBACK:-true}
      LLM_ENABLE_CACHE: ${LLM_ENABLE_CACHE:-true}
      AGENT_MAX_REPAIR_ATTEMPTS: ${AGENT_MAX_REPAIR_ATTEMPTS:-2}
  ocr:
    mem_limit: 400m
  ml:
    mem_limit: 768m     # LightGBM/XGBoost/sklearn models + a Task 2A refit (statsmodels) in memory
  frontend:
    build: { context: ./frontend, args: { NEXT_PUBLIC_DESIGN_PREVIEW: "off" } }   # no ?design=1 prototype in production
    mem_limit: 384m
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      DEMO_ADMIN_PASSWORD_HINT: ""        # the public start page never shows the admin password
  mobile-web:
    mem_limit: 64m
    # Lodestar Run is an Android app: a browser build made here (up.sh, an image missing) leaves it out too
    build: { args: { RUN_ON_WEB: "false" } }

volumes:
  caddy_data:
  caddy_config:
